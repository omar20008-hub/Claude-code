<title>AI Workforce Screens - Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #f5f8f5;
    --surface: #ffffff;
    --surface-2: #eef2ee;
    --ink: #16211c;
    --ink-muted: #5d6b63;
    --ink-faint: #8b978f;
    --accent: #2e6a4e;
    --accent-soft: #dcefe3;
    --accent-ink: #21503b;
    --line: #dfe6e0;
    --line-strong: #c7d2c9;
    --warn: #a86a09;
    --warn-soft: #fdf3dd;
    --info: #24608f;
    --info-soft: #e4eef7;
    --shadow: 0 1px 2px rgba(22, 33, 28, .05), 0 12px 32px -12px rgba(22, 33, 28, .18);

    --sans: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif;
    --arabic: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f1512;
      --surface: #18211c;
      --surface-2: #1f2a24;
      --ink: #e7eee9;
      --ink-muted: #94a29a;
      --ink-faint: #6d7c74;
      --accent: #74c495;
      --accent-soft: #1c3026;
      --accent-ink: #a8dcbe;
      --line: #26312b;
      --line-strong: #33413a;
      --warn: #d9a441;
      --warn-soft: #2a2317;
      --info: #79b3e0;
      --info-soft: #16242f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -16px rgba(0, 0, 0, .7);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0f1512;
    --surface: #18211c;
    --surface-2: #1f2a24;
    --ink: #e7eee9;
    --ink-muted: #94a29a;
    --ink-faint: #6d7c74;
    --accent: #74c495;
    --accent-soft: #1c3026;
    --accent-ink: #a8dcbe;
    --line: #26312b;
    --line-strong: #33413a;
    --warn: #d9a441;
    --warn-soft: #2a2317;
    --info: #79b3e0;
    --info-soft: #16242f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -16px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  [dir="rtl"] { font-family: var(--arabic); }

  .wrap {
    max-width: 1180px;
    margin-inline: auto;
    padding-inline: 20px;
    padding-block: 32px 64px;
  }

  header { display: flex; flex-direction: column; gap: 20px; }

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 6px;
  }

  h1 {
    font-size: clamp(26px, 4vw, 34px);
    line-height: 1.15;
    letter-spacing: -.02em;
    font-weight: 600;
    margin: 0;
    text-wrap: balance;
  }

  .lede {
    margin: 10px 0 0;
    color: var(--ink-muted);
    max-width: 60ch;
  }

  .switch {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
  }

  .switch button {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    border: 0;
    background: transparent;
    color: var(--ink-muted);
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
  }

  .switch button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent-ink);
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-block: 4px;
    border-block-start: 1px solid var(--line);
    padding-block-start: 20px;
  }

  nav button {
    font: inherit;
    font-size: 13px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-muted);
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
  }

  nav button:hover { background: var(--surface-2); color: var(--ink); }

  nav button[aria-current="true"] {
    background: var(--surface);
    border-color: var(--line-strong);
    color: var(--ink);
    font-weight: 500;
  }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 28px;
    align-items: start;
    margin-block-start: 28px;
  }

  @media (max-width: 860px) {
    main { grid-template-columns: minmax(0, 1fr); }
  }

  .viewport {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .chrome {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-block-end: 1px solid var(--line);
    background: var(--surface-2);
  }

  .dots { display: flex; gap: 6px; flex-shrink: 0; }
  .dots i {
    inline-size: 9px;
    block-size: 9px;
    border-radius: 50%;
    background: var(--line-strong);
    display: block;
  }

  .addr {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 10px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .shot {
    display: flex;
    inline-size: 100%;
    max-inline-size: 100%;
    block-size: 400px;
    background: linear-gradient(135deg, var(--surface-2) 0%, var(--accent-soft) 100%);
    align-items: center;
    justify-content: center;
    font-size: 48px;
    cursor: pointer;
  }

  figure { margin: 0; }

  figcaption {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 14px;
    border-block-start: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-faint);
  }

  aside { display: flex; flex-direction: column; gap: 18px; }

  .note {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
  }

  .note h2 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 600;
  }

  .note p { margin: 0; color: var(--ink-muted); font-size: 14px; }

  .preview {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
  }

  .preview strong { color: var(--accent-ink); font-weight: 600; display: block; margin-bottom: 8px; }
  .preview ul { margin: 0; padding-inline-start: 20px; }
  .preview li { margin: 4px 0; }

  .look {
    border-inline-start: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
    padding: 14px 16px;
  }

  .look .label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent-ink);
    display: block;
    margin-block-end: 6px;
  }

  .look p { color: var(--accent-ink); font-size: 13.5px; margin: 0; }
</style>

<div class="wrap" id="root">
  <header>
    <div class="masthead">
      <div>
        <p class="eyebrow">المعرض التفاعلي</p>
        <h1>منصة AI Workforce</h1>
        <p class="lede">جميع شاشات التطبيق مع تفاصيل شاملة عن كل ميزة</p>
      </div>
      <div class="switch" role="group" aria-label="Language">
        <button id="btn-ar" data-locale="ar" aria-pressed="true">العربية</button>
        <button id="btn-en" data-locale="en" aria-pressed="false">English</button>
      </div>
    </div>
    <nav id="rail" aria-label="Screens"></nav>
  </header>

  <main>
    <div class="viewport">
      <div class="chrome">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="addr" id="addr"></span>
      </div>
      <figure>
        <div class="shot" id="shot"></div>
      </figure>
    </div>

    <aside>
      <div class="note">
        <h2 id="screen-title"></h2>
        <p id="screen-desc"></p>
      </div>
      <div class="preview" id="preview"></div>
      <div class="look">
        <span class="label">العناصر المهمة</span>
        <p id="look-text"></p>
      </div>
    </aside>
  </main>
</div>

  let locale = 'ar';
  let index = 1;

  const $ = (id) => document.getElementById(id);

  function renderRail() {
    const rail = $('rail');
    rail.replaceChildren();
    SCREENS.forEach((screen, i) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = `${screen.emoji} ${screen[locale].title}`;
      button.setAttribute('aria-current', String(i === index));
      button.addEventListener('click', () => { index = i; render(); });
      rail.append(button);
    });
  }

  function render() {
    const screen = SCREENS[index];
    const copy = screen[locale];
    const root = $('root');
    const dir = locale === 'ar' ? 'rtl' : 'ltr';

    root.dir = dir;
    root.lang = locale;

    $('addr').textContent = `app.example.com/${locale}/${screen.path}`;
    $('shot').textContent = screen.emoji;

    $('screen-title').textContent = copy.title;
    $('screen-desc').textContent = copy.desc;
    $('preview').innerHTML = copy.preview || '';
    $('look-text').textContent = copy.look;

    renderRail();
  }

  document.querySelectorAll('.switch button').forEach((button) => {
    button.addEventListener('click', () => {
      locale = button.dataset.locale;
      button.parentElement.querySelectorAll('button').forEach(b =>
        b.setAttribute('aria-pressed', String(b === button))
      );
      render();
    });
  });

  render();
</script>
